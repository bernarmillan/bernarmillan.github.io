<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="200" height="200" rx="100" fill="url(#avatarGrad)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Stylized Monogram / Avatar Silhouette -->
  <g fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tech & Maker hexagonal badge -->
    <polygon points="100,42 145,68 145,120 100,146 55,120 55,68" stroke="url(#accentGrad)" stroke-width="2.5" fill="#1e293b" fill-opacity="0.6"/>
    <!-- 3D Cube / Chip inner icon -->
    <path d="M100 68 L126 83 L100 98 L74 83 Z" fill="#22d3ee" fill-opacity="0.15"/>
    <path d="M74 83 L74 113 L100 128 L100 98 Z" fill="#22d3ee" fill-opacity="0.25"/>
    <path d="M126 83 L126 113 L100 128 L100 98 Z" fill="#22d3ee" fill-opacity="0.35"/>
  </g>
  
  <!-- Bernardo Initial 'B' -->
  <text x="100" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">B</text>
  
  <!-- Subtle subtitle -->
  <text x="100" y="174" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#38bdf8" text-anchor="middle">IT · 3D MAKER</text>
</svg>
