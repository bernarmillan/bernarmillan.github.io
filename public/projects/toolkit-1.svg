<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="spotlight3" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="plaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#spotlight3)"/>
  
  <ellipse cx="300" cy="360" rx="170" ry="25" fill="#000000" opacity="0.6"/>
  
  <text x="35" y="45" font-family="monospace" font-size="13" fill="#38bdf8" font-weight="bold">FABRICACIÓN ADITIVA FDM // PRUSA MK3S+</text>
  <text x="35" y="65" font-family="monospace" font-size="11" fill="#94a3b8">MATERIAL: PLA PRO MATTE BLUE + 6X IMANES N52 ENCAPSULADOS EN PAUSA</text>

  <!-- Physical Holder with tools in it -->
  <g transform="translate(150, 110)">
    <polygon points="150,40 280,100 150,160 20,100" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/>
    <polygon points="20,100 150,160 150,220 20,160" fill="url(#plaBlue)" stroke="#1e3a8a" stroke-width="1.5"/>
    <polygon points="150,160 280,100 280,160 150,220" fill="#1e40af" stroke="#172554" stroke-width="1.5"/>
    
    <!-- Hex Allen keys sticking out -->
    <path d="M 60 95 L 60 30 L 80 20" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <path d="M 85 107 L 85 45 L 102 38" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M 110 119 L 110 60 L 124 54" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Pliers handles sticking out -->
    <path d="M 190 120 L 180 40" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <path d="M 220 105 L 210 30" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <path d="M 197 60 L 193 45" stroke="#475569" stroke-width="6"/>

    <text x="50" y="245" font-family="monospace" font-size="10" fill="#60a5fa">ADHERIDO AL PERFIL 2020 DE ALUMINIO</text>
  </g>
  
  <rect x="400" y="390" width="170" height="32" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1"/>
  <text x="485" y="411" font-family="sans-serif" font-size="12" font-weight="600" fill="#93c5fd" text-anchor="middle">PIEZA FÍSICA IMPRESA</text>
</svg>