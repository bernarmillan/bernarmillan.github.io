<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="petgOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="petgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#spotlight)"/>
  
  <!-- Studio shadow -->
  <ellipse cx="300" cy="360" rx="180" ry="30" fill="#000000" opacity="0.6"/>
  
  <!-- Info Overlay -->
  <text x="35" y="45" font-family="monospace" font-size="13" fill="#fb923c" font-weight="bold">FABRICACIÓN ADITIVA FDM // PRUSA MK3S+</text>
  <text x="35" y="65" font-family="monospace" font-size="11" fill="#94a3b8">MATERIAL: PRUSAMENT PETG ORANGE | ALTURA CAPA: 0.20mm | RELLENO: 25% GYROID</text>

  <!-- 3D Printed Solid Piece -->
  <g transform="translate(140, 105)">
    <!-- Base Plate -->
    <polygon points="160,50 280,110 160,170 40,110" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
    <!-- Left vertical upright -->
    <polygon points="40,110 90,85 90,205 40,230" fill="url(#petgDark)" stroke="#9a3412" stroke-width="1.5"/>
    <!-- Front Face -->
    <polygon points="40,230 160,290 160,170 40,110" fill="url(#petgOrange)" stroke="#9a3412" stroke-width="1.5"/>
    <!-- Right side -->
    <polygon points="160,290 280,230 280,110 160,170" fill="#9a3412" stroke="#7c2d12" stroke-width="1.5"/>
    
    <!-- Chamfers and Screw Holes with Metal Washers (M6 Cage Nut screws) -->
    <g fill="#334155" stroke="#cbd5e1" stroke-width="2">
      <ellipse cx="65" cy="180" rx="6" ry="12"/>
      <circle cx="65" cy="180" r="3" fill="#94a3b8"/>
      <ellipse cx="65" cy="210" rx="6" ry="12"/>
      <circle cx="65" cy="210" r="3" fill="#94a3b8"/>
    </g>
    
    <!-- Cable Routing Groove with real cable pass -->
    <path d="M130 245 C 130 260, 180 280, 220 250" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <text x="230" y="255" font-family="sans-serif" font-size="9" fill="#94a3b8">Cat.6 UTP</text>
  </g>
  
  <!-- Status Badge -->
  <rect x="400" y="390" width="170" height="32" rx="6" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="1"/>
  <text x="485" y="411" font-family="sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">PIEZA FÍSICA IMPRESA</text>
</svg>