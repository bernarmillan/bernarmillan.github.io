<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="#0b1120"/>
  <rect width="600" height="450" fill="url(#grid2)" opacity="0.6"/>
  
  <text x="35" y="45" font-family="monospace" font-size="13" fill="#38bdf8" font-weight="bold">AUTODESK FUSION 360 // ENSAMBLAJE IP65</text>
  <text x="35" y="65" font-family="monospace" font-size="11" fill="#64748b">PROYECTO: ENCLOSURE_ESP32_OUTDOOR | JUNTA TÓRICA TPU</text>

  <!-- Exploded View CAD model -->
  <g transform="translate(150, 100)">
    <!-- Top Lid (Floating up) -->
    <g transform="translate(0, -30)">
      <polygon points="150,20 260,75 150,130 40,75" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
      <polygon points="40,75 150,130 150,145 40,90" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.5"/>
      <polygon points="150,130 260,75 260,90 150,145" fill="#075985" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Screw inserts -->
      <circle cx="55" cy="80" r="3" fill="#38bdf8"/>
      <circle cx="245" cy="80" r="3" fill="#38bdf8"/>
      <text x="150" y="70" font-family="monospace" font-size="10" fill="#7dd3fc" text-anchor="middle">TAPA SUPERIOR [ASA]</text>
    </g>

    <!-- TPU Gasket (O-ring) -->
    <polygon points="150,90 250,140 150,190 50,140" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="6,4"/>
    <text x="270" y="145" font-family="monospace" font-size="10" fill="#22d3ee">← JUNTA FLEXIBLE [TPU 95A]</text>

    <!-- Main Enclosure Body -->
    <g transform="translate(0, 70)">
      <polygon points="150,70 260,125 150,180 40,125" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <polygon points="40,125 150,180 150,230 40,175" fill="#0369a1" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2"/>
      <polygon points="150,180 260,125 260,175 150,230" fill="#075985" fill-opacity="0.6" stroke="#38bdf8" stroke-width="2"/>
      
      <!-- Cable gland hole -->
      <ellipse cx="205" cy="180" rx="10" ry="14" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="220" y="185" font-family="monospace" font-size="9" fill="#94a3b8">PG7 Gland</text>
    </g>
  </g>
  
  <rect x="420" y="390" width="150" height="32" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
  <text x="495" y="411" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">RENDER CAD 3D</text>
</svg>