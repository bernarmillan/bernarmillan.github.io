<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="cadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="#0b1120"/>
  <rect width="600" height="450" fill="url(#grid)" opacity="0.6"/>
  
  <!-- CAD Axis & HUD -->
  <text x="35" y="45" font-family="monospace" font-size="13" fill="#38bdf8" font-weight="bold">AUTODESK FUSION 360 // MODELADO PARAMÉTRICO</text>
  <text x="35" y="65" font-family="monospace" font-size="11" fill="#64748b">PIEZA: RACK_BRACKET_MODULAR_V3.F3D | TOLERANCIA: ±0.15mm</text>
  
  <!-- Isometric CAD Wireframe / Solid -->
  <g transform="translate(140, 110)">
    <!-- Base plate -->
    <polygon points="160,50 280,110 160,170 40,110" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="2"/>
    <!-- Left vertical upright -->
    <polygon points="40,110 90,85 90,205 40,230" fill="#0284c7" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2"/>
    <!-- Front face -->
    <polygon points="40,230 160,290 160,170 40,110" fill="#075985" fill-opacity="0.4" stroke="#38bdf8" stroke-width="2"/>
    <!-- Top inner face -->
    <polygon points="90,85 210,145 210,175 90,115" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <!-- Right side -->
    <polygon points="160,290 280,230 280,110 160,170" fill="#0c4a6e" fill-opacity="0.6" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Rack mounting screw slots (standard 1U) -->
    <ellipse cx="65" cy="180" rx="6" ry="12" fill="#0b1120" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="65" cy="210" rx="6" ry="12" fill="#0b1120" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="140" cy="255" rx="10" ry="5" fill="#0b1120" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Dimension lines -->
    <line x1="25" y1="110" x2="25" y2="230" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="10" y="175" font-family="monospace" font-size="10" fill="#22d3ee">44.45mm (1U)</text>
  </g>
  
  <!-- Status Badge -->
  <rect x="420" y="390" width="150" height="32" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
  <text x="495" y="411" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">RENDER CAD 3D</text>
</svg>