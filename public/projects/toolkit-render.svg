<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <pattern id="grid3" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="#0b1120"/>
  <rect width="600" height="450" fill="url(#grid3)" opacity="0.6"/>
  
  <text x="35" y="45" font-family="monospace" font-size="13" fill="#38bdf8" font-weight="bold">FREECAD // SOPORTE MAGNÉTICO ERGONÓMICO</text>
  <text x="35" y="65" font-family="monospace" font-size="11" fill="#64748b">DISEÑO MODULAR CON ALOJAMIENTOS PARA IMANES NEODIMIO N52</text>

  <!-- Isometric CAD Tool Holder -->
  <g transform="translate(150, 110)">
    <!-- Base block with slots -->
    <polygon points="150,40 280,100 150,160 20,100" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="20,100 150,160 150,220 20,160" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="150,160 280,100 280,160 150,220" fill="#075985" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Slots for hex keys -->
    <ellipse cx="60" cy="95" rx="6" ry="10" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="85" cy="107" rx="5" ry="9" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="110" cy="119" rx="4" ry="8" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- Pliers recess -->
    <polygon points="160,115 210,90 250,110 200,135" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="210" y="115" font-family="monospace" font-size="9" fill="#7dd3fc" text-anchor="middle">Ranura Alicates</text>

    <!-- Hidden Magnet Cavity (dotted line) -->
    <ellipse cx="80" cy="180" rx="14" ry="8" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="75" y="200" font-family="monospace" font-size="9" fill="#22d3ee">Imán 10x3mm</text>
  </g>
  
  <rect x="420" y="390" width="150" height="32" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
  <text x="495" y="411" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">RENDER CAD 3D</text>
</svg>