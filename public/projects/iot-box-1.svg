<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="spotlight2" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="asaGrey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#spotlight2)"/>
  
  <ellipse cx="300" cy="360" rx="170" ry="25" fill="#000000" opacity="0.6"/>
  
  <text x="35" y="45" font-family="monospace" font-size="13" fill="#38bdf8" font-weight="bold">FABRICACIÓN ADITIVA TÉCNICA // BAMBU LAB P1S</text>
  <text x="35" y="65" font-family="monospace" font-size="11" fill="#94a3b8">MATERIAL: ASA GREY UV-RESISTANT + TPU SEAL | INSERTOS ROSCADOS M3 EN CALIENTE</text>

  <!-- Physical Box Assembled -->
  <g transform="translate(150, 110)">
    <!-- Top Lid with screw heads -->
    <polygon points="150,30 260,85 150,140 40,85" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
    <!-- Box side and front -->
    <polygon points="40,85 150,140 150,230 40,175" fill="url(#asaGrey)" stroke="#1e293b" stroke-width="1.5"/>
    <polygon points="150,140 260,85 260,175 150,230" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Screws (Stainless Steel) -->
    <circle cx="55" cy="90" r="4" fill="#cbd5e1" stroke="#475569"/>
    <circle cx="245" cy="90" r="4" fill="#cbd5e1" stroke="#475569"/>
    <circle cx="150" cy="132" r="4" fill="#cbd5e1" stroke="#475569"/>
    
    <!-- Cable Gland & Wire -->
    <ellipse cx="210" cy="180" rx="12" ry="16" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <path d="M 210 180 Q 250 200 290 280" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Status LED Glow from inside -->
    <circle cx="100" cy="115" r="5" fill="#22c55e"/>
    <circle cx="100" cy="115" r="10" fill="#22c55e" opacity="0.3"/>
    <text x="75" y="145" font-family="monospace" font-size="9" fill="#86efac">POWER / STATUS</text>
  </g>
  
  <rect x="400" y="390" width="170" height="32" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
  <text x="485" y="411" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">PIEZA FÍSICA IMPRESA</text>
</svg>